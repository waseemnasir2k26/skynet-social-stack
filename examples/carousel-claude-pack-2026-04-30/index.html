<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waseem Carousels — Industry Style Pack (5×6 = 30 cards)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --cream:#F2EBE0;
  --cream-deep:#E8DFD0;
  --rust:#C4502E;
  --rust-dark:#A23A1F;
  --ink:#1F1B17;
  --ink-soft:#3A332C;
  --gray:#8C8479;
  --term-bg:#1A1614;
  --term-fg:#E8DFCF;
  --term-dim:#8C8479;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0B0A09}
body{
  font-family:'Inter',sans-serif;
  color:var(--cream);
  padding:32px 24px 80px;
  min-height:100vh;
}
.page-head{max-width:1280px;margin:0 auto 24px}
.page-head h1{font-family:'Archivo Black';font-size:36px;letter-spacing:-1px;margin-bottom:6px}
.page-head p{color:#8C8479;font-size:13px;line-height:1.5}
.page-head code{background:#1F1B17;padding:2px 6px;border-radius:3px;color:#E8DFCF;font-family:'JetBrains Mono';font-size:12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;max-width:1280px;margin:24px auto 32px}
.tab{padding:11px 18px;background:#1F1B17;color:#C4B79E;border:1px solid #3A332C;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;transition:all .15s}
.tab:hover{background:#2A2520}
.tab.active{background:var(--rust);color:#fff;border-color:var(--rust)}
.tab .num{opacity:.6;margin-right:6px}
.carousel{display:none;max-width:1280px;margin:0 auto}
.carousel.active{display:block}
.carousel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding:16px 20px;background:#161412;border:1px solid #2A2520;border-radius:8px}
.carousel-head h2{font-family:'Archivo Black';font-size:18px;color:#fff;letter-spacing:0.5px}
.carousel-head .meta{color:#8C8479;font-size:12px;margin-top:4px;font-family:'JetBrains Mono'}
.btn-all{padding:11px 18px;background:var(--rust);color:#fff;border:0;border-radius:6px;cursor:pointer;font-weight:700;font-size:12px;letter-spacing:0.6px;text-transform:uppercase}
.btn-all:hover{background:var(--rust-dark)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,540px);gap:32px;justify-content:center}
.card-wrap{position:relative;width:540px;height:675px}
.card-wrap .dl{position:absolute;top:8px;right:8px;z-index:50;padding:6px 12px;background:rgba(15,14,12,0.85);color:#fff;border:1px solid var(--rust);border-radius:4px;cursor:pointer;font-size:10px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;backdrop-filter:blur(4px)}
.card-wrap .dl:hover{background:var(--rust)}
.card-wrap .num{position:absolute;top:8px;left:8px;z-index:50;padding:4px 8px;background:rgba(15,14,12,0.7);color:#C4B79E;border-radius:4px;font-size:10px;font-family:'JetBrains Mono';font-weight:700}

.card{
  width:1080px;height:1350px;
  transform:scale(0.5);transform-origin:top left;
  background:var(--cream);
  position:relative;
  font-family:'Inter',sans-serif;
  color:var(--ink);
  overflow:hidden;
}
.card::before{
  content:"";position:absolute;inset:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220' viewBox='0 0 220 220'><g stroke='%23A89E8C' stroke-width='0.6' fill='none' opacity='0.55'><path d='M0 40 L60 40 L60 0'/><path d='M100 0 L100 80 L170 80 L170 220'/><path d='M0 120 L80 120 L80 160 L150 160'/><path d='M40 220 L40 180 L0 180'/><path d='M180 0 L180 30 L220 30'/><path d='M180 110 L220 110'/><path d='M30 0 L30 20'/><path d='M130 220 L130 200 L100 200'/></g><g fill='%23A89E8C' opacity='0.6'><circle cx='60' cy='40' r='2'/><circle cx='100' cy='80' r='2'/><circle cx='170' cy='80' r='2'/><circle cx='80' cy='120' r='2'/><circle cx='80' cy='160' r='2'/><circle cx='150' cy='160' r='2'/><circle cx='40' cy='180' r='2'/><circle cx='180' cy='30' r='2'/></g></svg>");
  background-size:340px 340px;
  opacity:0.4;
  pointer-events:none;
}
.card-inner{position:relative;z-index:2;padding:64px 72px 56px;height:100%;display:flex;flex-direction:column}

.tag-row{display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono';font-size:18px;color:var(--ink-soft);letter-spacing:1.5px;font-weight:700}
.section-tag{margin-top:60px;font-family:'JetBrains Mono';font-size:18px;color:var(--rust);letter-spacing:3px;font-weight:700}
.section-tag.big{font-family:'Archivo Black';font-size:48px;letter-spacing:1px;margin-top:36px;color:var(--ink)}
.section-tag.big .num{color:var(--rust)}

.headline{font-family:'Archivo Black';font-size:104px;line-height:0.92;letter-spacing:-2.5px;margin-top:28px;text-transform:uppercase;color:var(--ink)}
.headline.sm{font-size:88px}
.headline.xs{font-size:72px}
.headline .accent{color:var(--rust)}
.subhead{font-family:'Inter';font-weight:700;font-size:22px;line-height:1.45;color:var(--ink-soft);margin-top:36px;text-transform:uppercase;letter-spacing:0.6px;max-width:900px}

.terminal-wrap{margin-top:auto;position:relative}
.terminal-label{font-family:'JetBrains Mono';font-size:18px;color:var(--rust);font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.terminal-label::before{content:"✸";color:var(--rust);font-size:22px}
.terminal{
  background:var(--term-bg);
  border-radius:18px;
  padding:32px 40px 36px;
  font-family:'JetBrains Mono';
  font-size:22px;
  line-height:1.65;
  color:var(--term-fg);
  position:relative;
  box-shadow:0 8px 0 rgba(31,27,23,0.06);
}
.terminal .lights{display:flex;gap:9px;margin-bottom:22px}
.terminal .lights span{width:14px;height:14px;border-radius:50%}
.terminal .lights span:nth-child(1){background:#FF5F56}
.terminal .lights span:nth-child(2){background:#FFBD2E}
.terminal .lights span:nth-child(3){background:#27C93F}
.terminal .ln{white-space:pre}
.terminal .prompt{color:var(--rust);font-weight:700}
.terminal .arrow{color:#C4B79E}
.terminal .ok{color:#27C93F;font-weight:700}
.terminal .bad{color:#FF5F56;font-weight:700}
.terminal .dim{color:var(--term-dim)}

.mascot{position:absolute;right:-12px;bottom:8px;width:170px;height:auto;z-index:3}
.mascot.lg{width:200px;right:0;bottom:0}

.bottom{margin-top:32px;display:flex;justify-content:space-between;align-items:center}
.handle{display:flex;align-items:center;gap:12px;font-family:'JetBrains Mono';font-size:20px;color:var(--ink);font-weight:700}
.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;border:3px solid var(--cream);box-shadow:0 0 0 1px #C4B79E}
.verified{color:#3B82F6;font-size:18px}
.dots{display:flex;gap:8px;position:absolute;left:50%;bottom:60px;transform:translateX(-50%)}
.dots span{width:8px;height:8px;border-radius:50%;background:#C4B79E;opacity:.7}
.dots span.on{background:var(--rust);opacity:1;width:24px;border-radius:4px}

.swipe{position:absolute;right:64px;bottom:72px;font-family:'Archivo Black';font-size:22px;color:var(--rust);display:flex;align-items:center;gap:8px}
.swipe svg{width:34px;height:34px}

.side-arrow{position:absolute;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,0.6);display:flex;align-items:center;justify-content:center;color:var(--rust);font-size:24px;font-weight:700;border:1px solid #C4B79E}
.side-arrow.left{left:0;border-left:0;border-radius:0 27px 27px 0}
.side-arrow.right{right:0;border-right:0;border-radius:27px 0 0 27px}

.cta-stack{display:flex;flex-direction:column;gap:14px;margin-top:38px}
.cta-pill{display:inline-flex;align-items:center;gap:14px;padding:18px 26px;background:var(--ink);color:var(--cream);border-radius:12px;font-family:'JetBrains Mono';font-size:22px;font-weight:700;letter-spacing:0.5px;width:fit-content}
.cta-pill .k{color:var(--rust)}
.cta-pill.alt{background:var(--rust);color:#fff}

@media (max-width:1180px){
  .cards{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
  .card-wrap{width:auto;height:auto;aspect-ratio:1080/1350;max-width:540px}
  .card{transform:scale(.4);transform-origin:top left}
  .card-wrap{height:540px}
}
</style>
</head>

function renderCard(c, slide, idx, total){
  const dotsHtml = Array.from({length:total},(_,i)=>`<span class="${i===idx?'on':''}"></span>`).join('');
  const pageNum = String(idx+1).padStart(2,'0') + ' / ' + String(total).padStart(2,'0');
  let body = '';

  if(slide.kind === 'hero'){
    body = `
      <div class="tag-row">
        <span class="handle-top">${HANDLE}</span>
        <span>${pageNum}</span>
      </div>
      <div class="section-tag">${slide.tag||''}</div>
      <h1 class="headline">${slide.headline.map(l=>`<div>${l}</div>`).join('')}</h1>
      <p class="subhead">${slide.sub}</p>
      <div class="terminal-wrap">
        ${slide.label?`<div class="terminal-label">${slide.label}</div>`:''}
        <div class="terminal">
          <div class="lights"><span></span><span></span><span></span></div>
          ${slide.term.map(l=>`<div class="ln">${l}</div>`).join('')}
        </div>
        <svg class="mascot"><use href="#${slide.bot}"/></svg>
      </div>`;
  }
  else if(slide.kind === 'trick'){
    body = `
      <div class="tag-row">
        <span class="handle-top">${HANDLE}</span>
        <span>${pageNum}</span>
      </div>
      <div class="section-tag big">TRICK <span class="num">${slide.n}</span></div>
      <h1 class="headline sm">${slide.headline.map(l=>`<div>${l}</div>`).join('')}</h1>
      <p class="subhead">${slide.sub}</p>
      <div class="terminal-wrap">
        ${slide.label?`<div class="terminal-label">${slide.label}</div>`:''}
        <div class="terminal">
          <div class="lights"><span></span><span></span><span></span></div>
          ${slide.term.map(l=>`<div class="ln">${l}</div>`).join('')}
        </div>
        <svg class="mascot"><use href="#${slide.bot}"/></svg>
      </div>`;
  }
  else if(slide.kind === 'cta'){
    body = `
      <div class="tag-row">
        <span class="handle-top">${HANDLE}</span>
        <span>${pageNum}</span>
      </div>
      <div class="section-tag">${slide.tag||''}</div>
      <h1 class="headline sm">${slide.headline.map(l=>`<div>${l}</div>`).join('')}</h1>
      <p class="subhead">${slide.sub}</p>
      <div class="cta-stack">
        ${slide.ctas.map((x,i)=>`<div class="cta-pill ${i===slide.ctas.length-1?'alt':''}"><span class="k">${x.k}</span> <span>${x.v}</span></div>`).join('')}
      </div>
      <svg class="mascot lg" style="position:absolute;right:64px;bottom:120px;width:170px"><use href="#${slide.bot}"/></svg>`;
  }

  const isLast = idx === total-1;
  const swipe = !isLast ? `<div class="swipe">SWIPE <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>` : '';

  return `
    <div class="card-wrap">
      <span class="num">${idx+1}/${total}</span>
      <button class="dl" data-card-id="${c.id}-${idx}">↓ PNG</button>
      <div class="card" id="card-${c.id}-${idx}">
        <div class="card-inner">${body}</div>
        <div class="dots">${dotsHtml}</div>
        ${swipe}
        <div class="bottom" style="position:absolute;left:64px;right:64px;bottom:48px">
          <div class="handle">
            <img src="${AVATARS[c.id]}" class="avatar" crossorigin="anonymous">
            <span>${HANDLE.replace('@','')}</span>
            <span class="verified">✓</span>
          </div>
          <span></span>
        </div>
      </div>
    </div>`;
}

function render(){
  const tabs = document.getElementById('tabs');
  const root = document.getElementById('root');
  tabs.innerHTML = carousels.map((c,i)=>`<button class="tab ${i===0?'active':''}" data-tab="${c.id}"><span class="num">0${i+1}</span>${c.tab}</button>`).join('');
  root.innerHTML = carousels.map((c,i)=>`
    <div class="carousel ${i===0?'active':''}" id="carousel-${c.id}">
      <div class="carousel-head">
        <div>
          <h2>${c.title}</h2>
          <div class="meta">${c.meta}</div>
        </div>
        <button class="btn-all" data-all="${c.id}">↓ Download all 6 PNGs</button>
      </div>
      <div class="cards">
        ${c.slides.map((s,si)=>renderCard(c,s,si,c.slides.length)).join('')}
      </div>
    </div>
  `).join('');

  // tab clicks
  tabs.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click',()=>{
      tabs.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      document.querySelectorAll('.carousel').forEach(x=>x.classList.remove('active'));
      document.getElementById('carousel-'+t.dataset.tab).classList.add('active');
    });
  });

  // single download
  document.querySelectorAll('.dl').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.cardId;
      await downloadCard(id);
    });
  });

  // download all in carousel
  document.querySelectorAll('.btn-all').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const cid = btn.dataset.all;
      btn.disabled = true; btn.textContent = 'rendering...';
      const c = carousels.find(x=>x.id===cid);
      for(let i=0;i<c.slides.length;i++){
        await downloadCard(`${cid}-${i}`);
        await new Promise(r=>setTimeout(r,300));
      }
      btn.disabled = false; btn.textContent = '↓ Download all 6 PNGs';
    });
  });
}

async function downloadCard(id){
  const el = document.getElementById('card-'+id);
  // temporarily un-scale for capture
  const original = el.style.transform;
  el.style.transform = 'none';
  el.style.position = 'absolute';
  el.style.left = '-99999px';
  document.body.appendChild(el);
  try{
    const canvas = await html2canvas(el, {
      width:1080, height:1350, scale:1,
      backgroundColor:'#F2EBE0',
      useCORS:true, allowTaint:true,
    });
    const link = document.createElement('a');
    link.download = `waseem-carousel-${id}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } finally {
    el.style.transform = original;
    el.style.position = '';
    el.style.left = '';
    // put back into card-wrap
    document.getElementById('card-'+id+'-wrap-anchor');
  }
}
// simpler: render uses fixed positions — to safely re-host, wrap original anchor
// simpler path: don't move element, just render and let html2canvas use the scaled origin inversed via canvas scale
// → switching to a non-detach approach below
async function downloadCardSafe(id){
  const el = document.getElementById('card-'+id);
  const canvas = await html2canvas(el, {
    width:1080, height:1350, scale:1,
    backgroundColor:'#F2EBE0',
    useCORS:true, allowTaint:true,
    onclone:(doc)=>{
      const c = doc.getElementById('card-'+id);
      if(c){ c.style.transform='none'; }
    }
  });
  const link = document.createElement('a');
  link.download = `waseem-carousel-${id}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}
// override
downloadCard = downloadCardSafe;

render();
